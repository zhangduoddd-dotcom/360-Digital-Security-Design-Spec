<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平台固定框架模板</title>
  <link rel="stylesheet" href="./asset/icons/iconfont.css" />
  <link rel="stylesheet" href="./font-rendering.css" />
  <link rel="stylesheet" href="./platform-frame.css" />
  <link rel="stylesheet" href="./platform-frame-top-utility.css" />
</head>
<body>
  <div class="platform-frame" id="frame">
    <header class="platform-top-nav">
      <div class="top-nav-left">
        <div class="top-logo-wrap">
          <img class="top-logo" src="./asset/icons/svg_21e691e3.svg" alt="LOGO 占位" />
        </div>
        <div class="top-nav-menu-wrap">
          <nav class="top-nav-menu" id="topNav"></nav>
        </div>
      </div>
      <div class="top-nav-right">
        <div class="top-nav-right-inner">
          <div class="top-utility-row">
            <div class="top-utility-item">
              <svg class="top-utility-status-icon" viewBox="0 0 18 14" fill="none" aria-hidden="true">
                <rect x="0.8" y="6" width="1.6" height="3.2" rx=".8" fill="currentColor"/>
                <rect x="3.3" y="3.2" width="1.6" height="5.2" rx=".8" fill="currentColor"/>
                <rect x="5.8" y="5.2" width="1.6" height="6.2" rx=".8" fill="currentColor"/>
                <rect x="8.3" y="0" width="1.6" height="12.1" rx=".8" fill="currentColor"/>
                <rect x="10.9" y="2" width="1.6" height="7.1" rx=".8" fill="currentColor"/>
                <rect x="13.4" y="5.4" width="1.6" height="3.8" rx=".8" fill="currentColor"/>
                <path d="M15.2 11.5h2.2M16.3 10.4v2.2" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
              </svg>
              <span id="topStatusText">360全网安全大脑持续守护</span>
              <strong id="topStatusDays">328</strong>
              <span>天，共</span>
              <strong id="topSubscriptionCount">8</strong>
              <span>项订阅服务</span>
            </div>
            <div class="top-utility-divider"></div>
            <div class="top-utility-item selectable" data-top-popover="organizationPopover">
              <svg class="top-utility-icon" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M7 1.5 2.2 4.2v5.6L7 12.5l4.8-2.7V4.2L7 1.5Z" stroke="#00AB7A" stroke-width="1.2"/>
                <path d="M7 4.2v5.6M4.4 5.7l5.2-3M4.4 8.3l5.2 3" stroke="#00AB7A" stroke-width="1"/>
              </svg>
              <span class="top-utility-white" id="topOrganizationName">总公司全局</span>
              <svg class="top-utility-arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.25 7 8.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="top-utility-divider"></div>
            <div class="top-utility-item selectable" data-top-popover="userPopover">
              <svg class="top-utility-icon" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <circle cx="7" cy="4.2" r="2.3" stroke="#00AB7A" stroke-width="1.2"/>
                <path d="M2.4 12c.5-2.4 2.2-3.6 4.6-3.6s4.1 1.2 4.6 3.6" stroke="#00AB7A" stroke-width="1.2"/>
              </svg>
              <span class="top-utility-white" id="topUserName">超级管理员</span>
              <svg class="top-utility-arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.25 7 8.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="top-utility-divider"></div>
            <div class="top-utility-item icon-only" data-top-popover="noticePopover" title="通知">
              <svg class="top-utility-icon" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.1 5.3A4 4 0 0 1 7.2 1a4 4 0 0 1 4.2 4.3V9c.38.43.62 1 .64 1.63.01.24-.18.47-.43.47H9.32v.06a1.8 1.8 0 0 1-1.8 1.8H7.4a1.8 1.8 0 0 1-1.8-1.8v-.06H2.74a.43.43 0 0 1-.43-.44c0-.71.29-1.35.75-1.81V5.3Z" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>
            </div>
            <div class="top-utility-divider"></div>
            <div class="top-utility-item icon-only" data-top-popover="settingPopover" title="设置">
              <svg class="top-utility-icon" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M6.6 1 2 3.7v5.6L6.6 12a.8.8 0 0 0 .8 0L12 9.3V3.7L7.4 1a.8.8 0 0 0-.8 0Z" stroke="currentColor" stroke-width="1.1"/><circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.1"/></svg>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="top-popover" id="organizationPopover"></div>
    <div class="top-popover" id="noticePopover"></div>
    <div class="top-popover" id="settingPopover"></div>
    <div class="top-popover" id="userPopover"></div>

    <div class="platform-body">
      <aside class="platform-sidebar">
        <div class="sidebar-scroll" id="sidebar"></div>
        <div class="sidebar-footer">
          <button class="sidebar-collapse-button" type="button" id="collapseBtn" title="展开/收起菜单">
            <img class="sidebar-collapse-img" src="./asset/icons/svg_c7bf2c0f.svg" alt="展开收起" />
          </button>
          <div class="sidebar-version">V10.0</div>
        </div>
      </aside>

      <main class="platform-main">
        <section class="platform-page-header return-header">
          <button class="return-button" type="button" title="返回">
            <img class="return-icon" src="./asset/icons/svg_9875e337.svg" alt="返回" />
          </button>
          <span class="return-title" id="pageTitle">新增日志源</span>
        </section>

        <section class="platform-page-content">
          <!-- 业务内容唯一替换区：AI 生成页面时，只能替换 .platform-page-content 内部内容 -->
          <div class="content-shell">
            <div class="card">
              <div class="card-header">
                <div class="card-title">业务内容区示例</div>
                <button class="btn btn-primary" onclick="document.getElementById('collapseBtn').click()">切换展开收起</button>
              </div>
              <div class="card-body">
                <div class="demo-note">这里是唯一允许替换的业务内容区。后续生成页面时，只替换 .platform-page-content 内部内容。</div>
                <div class="rule-grid">
                  <div class="rule-card"><div class="rule-title">固定框架</div><div class="rule-desc">顶部导航、左侧菜单、可返回页头、内容区结构固定。</div></div>
                  <div class="rule-card"><div class="rule-title">左侧菜单</div><div class="rule-desc">支持展开、收起、收起态级联菜单和选中态同步。</div></div>
                  <div class="rule-card"><div class="rule-title">顶部右侧通用区</div><div class="rule-desc">单层导航和双层导航复用同一套状态、组织、用户、通知、设置结构。</div></div>
                  <div class="rule-card"><div class="rule-title">业务替换</div><div class="rule-desc">只替换业务文案、菜单数据、页面标题和业务内容。</div></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="./platform-frame-data.js"></script>
  <script src="./platform-frame.js"></script>
</body>
</html>
