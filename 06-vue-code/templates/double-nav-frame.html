/* ===== navigation icon usage rules ===== */
.iconfont {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
  color: currentColor;
}

.iconfont::before {
  color: currentColor;
}

.nav-icon-12 { width: 12px; height: 12px; font-size: 12px; }
.nav-icon-14 { width: 14px; height: 14px; font-size: 14px; }
.nav-icon-16 { width: 16px; height: 16px; font-size: 16px; }
.nav-icon-18 { width: 18px; height: 18px; font-size: 18px; }
.nav-icon-24 { width: 24px; height: 24px; font-size: 24px; }

/* 深色顶部导航：默认弱白，hover / open 变白；强调图标用品牌绿 */
.double-top-nav .iconfont,
.s-header .iconfont,
.terminal-topbar .iconfont {
  color: #AEB2B8;
}

.double-top-nav .top-security-icon,
.double-top-nav .company-icon,
.double-top-nav .user-profile-icon,
.s-header .safe-brain-iconfont,
.s-header .company-switch-icon,
.s-header .user-profile-icon,
.terminal-topbar .safe-brain-iconfont,
.terminal-topbar .company-switch-icon,
.terminal-topbar .user-profile-icon {
  color: #00AB7A !important;
}

.double-top-nav .top-info-item:hover .iconfont,
.double-top-nav .top-info-item.open .iconfont,
.double-top-nav .main-nav-item:hover .iconfont,
.double-top-nav .main-nav-item.open .iconfont,
.double-top-nav .global-menu:hover .iconfont,
.s-header .center-toggle:hover .iconfont,
.s-header .center-toggle.open .iconfont,
.s-header .visual-switch:hover .iconfont,
.s-header .visual-switch.open .iconfont,
.s-header .icon-button:hover .iconfont,
.s-header .icon-button.open .iconfont,
.s-header .user-dropdown:hover .iconfont,
.s-header .user-dropdown.open .iconfont,
.terminal-topbar .center-switch:hover .iconfont,
.terminal-topbar .center-switch.open .iconfont,
.terminal-topbar .visual-screen-trigger:hover .iconfont,
.terminal-topbar .visual-screen-trigger.open .iconfont,
.terminal-topbar .terminal-icon-button:hover .iconfont,
.terminal-topbar .terminal-icon-button.open .iconfont,
.terminal-topbar .terminal-user:hover .iconfont,
.terminal-topbar .terminal-user.open .iconfont {
  color: #FFFFFF !important;
}

/* 状态图标：不允许用 CSS 旋转代替，收起 / 展开分别显示不同 icon class */
.icon-state-expanded {
  display: none !important;
}

.open .icon-state-collapsed,
.expanded > .local-menu-row .icon-state-collapsed {
  display: none !important;
}

.open .icon-state-expanded,
.expanded > .local-menu-row .icon-state-expanded {
  display: inline-flex !important;
}

.dropdown-state,
.local-menu-arrow-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-left: 4px;
  flex-shrink: 0;
}

.local-menu-arrow-wrap {
  margin-left: 0;
}

/* 白色侧边栏：默认灰，hover / active 绿 */
.local-menu-icon,
.local-menu-arrow,
.local-collapse-icon {
  color: #8A9099 !important;
}

.local-menu-item:hover .local-menu-icon,
.local-menu-item:hover .local-menu-arrow,
.local-menu-item.active .local-menu-icon,
.local-menu-item.active .local-menu-arrow,
.local-collapse-icon:hover {
  color: #039972 !important;
}

.local-menu-item.disabled .local-menu-icon,
.local-menu-item.disabled .local-menu-arrow {
  color: #AEB2B8 !important;
}

/* 不再使用 SVG 箭头的旋转效果 */
.nav-chevron,
.down-icon,
.local-menu-arrow {
  transform: none !important;
  transition: color .16s ease !important;
}

/* 白底抽屉 / 面板内操作图标 */
.screen-setting .iconfont,
.safe-brain-popover button,
.safe-brain-popover .text-button {
  color: #039972 !important;
}


    :root {
      --top-bg: #242933;
      --brand-green: #00AB7A;
      --text-white: #FFFFFF;
      --text-weak: #AEB2B8;
      --text-muted: #8A9099;
      --split: #525966;
      --page-bg: #F2F3F5;
      --panel-bg: #FFFFFF;
      --border: #E8EAED;
    }

    * { box-sizing: border-box; }

    html,
    body,
    button,
    input,
    textarea,
    select {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
      font-synthesis: none;
      font-synthesis-weight: none;
      font-synthesis-style: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-width: 1280px;
      background: var(--page-bg);
      color: #242933;
    }

    .product-frame {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--page-bg);
    }

    .double-top-nav {
      height: 68px;
      flex-shrink: 0;

  <script>
    // 内容配置：替换这里即可调整顶部主导航。
    const navItems = [
      { label: '主导航一', dropdown: true, options: ['导航选项一', '导航选项二', '导航选项三'] },
      { label: '主导航二' },
      { label: '主导航三' },
      { label: '主导航四' },
      { label: '主导航五' },
      { label: '主导航六' },
      { label: '主导航七' },
      { label: '主导航八' }
    ];

    const nav = document.getElementById('mainNav');
    const dropdown = document.getElementById('navDropdown');
    let active = '主导航一';
    let openedBy = null;
    let closeTimer = null;

    function renderDropdownOptions(item) {
      const options = item.options || ['导航选项一', '导航选项二', '导航选项三'];
      dropdown.innerHTML = options.map((text, index) => (
        `<div class="nav-dropdown-option ${index === 0 ? 'active' : ''}">${text}</div>`
      )).join('');
    }

    function showDropdown(trigger, item) {
      if (!item.dropdown) return;

      clearTimeout(closeTimer);
      openedBy = item.label;
      renderDropdownOptions(item);

      const rect = trigger.getBoundingClientRect();
      dropdown.style.left = `${Math.round(rect.left)}px`;
      dropdown.style.top = `${Math.round(rect.bottom)}px`;
      dropdown.classList.add('visible');

      document.querySelectorAll('.main-nav-item.open').forEach(el => el.classList.remove('open'));
      trigger.classList.add('open');
    }

    function scheduleHideDropdown() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        dropdown.classList.remove('visible');
        document.querySelectorAll('.main-nav-item.open').forEach(el => el.classList.remove('open'));
        openedBy = null;
      }, 120);
    }

    function hideDropdownImmediately() {
      clearTimeout(closeTimer);
      dropdown.classList.remove('visible');
      document.querySelectorAll('.main-nav-item.open').forEach(el => el.classList.remove('open'));
      openedBy = null;
    }

    function renderNav() {
      const menuIcon = nav.querySelector('.global-menu');
      nav.innerHTML = '';
      nav.appendChild(menuIcon);

      navItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'main-nav-item' + (item.label === active ? ' active' : '') + (item.dropdown ? ' has-dropdown' : '');
        el.dataset.label = item.label;
        el.innerHTML = `
          <div class="main-nav-item-label">
            <span>${item.label}</span>
            ${item.dropdown ? '<span class="dropdown-state nav-chevron" aria-hidden="true"><i class="iconfont icon-xiajiantou nav-icon-14 icon-state-collapsed"></i><i class="iconfont icon-shangjiantou nav-icon-14 icon-state-expanded"></i></span>' : ''}
          </div>
        `;

        el.addEventListener('mouseenter', () => {
          if (item.dropdown) {
            showDropdown(el, item);
          } else {
            scheduleHideDropdown();
          }
        });

        el.addEventListener('mouseleave', () => {
          if (item.dropdown) scheduleHideDropdown();
        });

        el.addEventListener('click', (event) => {
          event.stopPropagation();
          active = item.label;
          renderNav();

          if (item.dropdown) {
            const latestTrigger = nav.querySelector(`[data-label="${item.label}"]`);
            if (latestTrigger) showDropdown(latestTrigger, item);
          } else {
            hideDropdownImmediately();
          }
        });

        nav.appendChild(el);
      });
    }

    dropdown.addEventListener('mouseenter', () => {
      clearTimeout(closeTimer);
    });

    dropdown.addEventListener('mouseleave', () => {
      scheduleHideDropdown();
    });

    dropdown.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    window.addEventListener('resize', () => {
      if (!dropdown.classList.contains('visible') || !openedBy) return;
      const item = navItems.find(item => item.label === openedBy);
      const trigger = nav.querySelector(`[data-label="${openedBy}"]`);
      if (item && trigger) showDropdown(trigger, item);
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.main-nav-item') && !event.target.closest('#navDropdown')) {
        hideDropdownImmediately();
      }
    });



    // 内容配置：替换这里即可调整左侧菜单树。
    const localBrainMenus = [
      { id: 'menu-1', label: '菜单一', icon: 'search' },

<script>
(function () {
  const subscriptionDays = 328;

  function getFrameRoot() {
    return document.querySelector('.product-frame') ||
      document.querySelector('.terminal-frame') ||

  function getArrowHTML() {

  function normalizeLeftMenuArrows() {
    const root = document.getElementById('localBrainSidebar');

      const children = node.querySelector(':scope > .local-menu-children');
      const button = node.querySelector(':scope > .local-menu-row .local-menu-item');
      if (!button) return;

      button.querySelectorAll('.local-menu-arrow-wrap, .left-menu-dropdown-state').forEach(arrow => arrow.remove());
      button.querySelectorAll('svg.local-menu-arrow').forEach(arrow => arrow.remove());

      if (children) {
        button.insertAdjacentHTML('beforeend', getArrowHTML());
      }
    });
  }

  function patchSidebarRenderHook() {
    const root = document.getElementById('localBrainSidebar');
    if (!root || root.dataset.arrowObserverReady === 'true') return;
    root.dataset.arrowObserverReady = 'true';
    normalizeLeftMenuArrows();
  }

  function makeSubscriptionHTML() {
    return '<i class="iconfont icon-anquandanao top-security-icon safe-brain-iconfont nav-icon-18" aria-hidden="true"></i>' +
      '<span class="subscription-trigger-copy">360全网安全大脑持续守护 <strong>' + subscriptionDays + '</strong> 天，共 <strong>' + subscriptionCount + '</strong> 项订阅服务</span>';
  }

  function getDoubleTopItems() {
    return Array.from(document.querySelectorAll('.double-top-nav .top-info-item'));
  }

  function findSubscriptionTrigger() {
    return document.getElementById('safeBrainTrigger') ||
      getDoubleTopItems().find(item => item.textContent.includes('持续守护') || item.textContent.includes('订阅'));
  }

  function findUserTrigger() {
    return document.getElementById('userDropdown') ||
      getDoubleTopItems().find(item => item.textContent.includes('超级管理员') || item.textContent.includes('用户名'));
  }

  function normalizeSubscriptionTrigger(trigger) {
    if (!trigger) return null;
    if (trigger.dataset.normalizedSubscription === 'true') return trigger;
    trigger.dataset.normalizedSubscription = 'true';
    trigger.innerHTML = makeSubscriptionHTML();
    return trigger;
  }

  function normalizeUserTrigger(trigger) {
    if (!trigger) return null;
    if (trigger.dataset.normalizedUser === 'true') return trigger;
    trigger.dataset.normalizedUser = 'true';

    const isDouble = trigger.classList.contains('top-info-item');
    const label = trigger.textContent.includes('超级管理员') ? '超级管理员' : '用户名';
    if (isDouble) {
      trigger.innerHTML = '<i class="iconfont icon-gerenzhongxin user-profile-icon primary-icon nav-icon-14" aria-hidden="true"></i>' +
        '<span class="top-info-text-white">' + label + '</span>' +
        '<span class="dropdown-state top-dropdown-state" aria-hidden="true">' +
        '<i class="iconfont icon-xiajiantou nav-icon-14 icon-state-collapsed"></i>' +
        '<i class="iconfont icon-shangjiantou nav-icon-14 icon-state-expanded"></i>' +
        '</span>';
    } else {
      trigger.innerHTML = '<span>' + label + '</span>' +
        '<span class="dropdown-state down-icon" aria-hidden="true">' +
        '<i class="iconfont icon-xiajiantou nav-icon-14 icon-state-collapsed"></i>' +
        '<i class="iconfont icon-shangjiantou nav-icon-14 icon-state-expanded"></i>' +
        '</span>';

    let panel = document.getElementById('sharedUserPopover');

    document.body.appendChild(panel);
    return panel;
  }

  function alignRight(trigger, panel) {
    panel.classList.add('visible');
    panel.style.visibility = 'hidden';
    panel.style.display = 'block';

    const rect = trigger.getBoundingClientRect();
    const width = Math.min(panel.offsetWidth || 156, window.innerWidth - 16);
    const left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8));

    panel.style.left = left + 'px';
    panel.style.top = rect.bottom + 'px';
    panel.style.visibility = '';
  }

  function bindHoverDropdown(trigger, panel) {
    if (!trigger || !panel || trigger.dataset.hoverBound === 'true') return;
    trigger.dataset.hoverBound = 'true';

    let closeTimer = null;

    function open() {
      clearTimeout(closeTimer);
      document.querySelectorAll('.nav-right-popover.visible').forEach(item => {
        if (item !== panel) item.classList.remove('visible');
      });
      document.querySelectorAll('.top-info-item.open, .safe-brain-trigger.open, .user-dropdown.open').forEach(item => {
        if (item !== trigger) item.classList.remove('open');
      });
      alignRight(trigger, panel);
      trigger.classList.add('open');
    }

    function close() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        const triggerHover = trigger.matches(':hover');
        const panelHover = panel.matches(':hover');
        if (!triggerHover && !panelHover) {
          panel.classList.remove('visible');
          trigger.classList.remove('open');
        }
      }, 100);
    }

    trigger.addEventListener('mouseenter', open);
    trigger.addEventListener('mouseleave', close);
    trigger.addEventListener('click', event => event.preventDefault());
    panel.addEventListener('mouseenter', () => clearTimeout(closeTimer));
    panel.addEventListener('mouseleave', close);
  }

    }
  }

    if (!button || button.dataset.finalCollapseBound === 'true') return;

  setTimeout(() => {
    normalizeLeftMenuArrows();
    patchSidebarRenderHook();

  setTimeout(() => {

    rebindSidebarCollapse();

})();

      '<i class="iconfont icon-xiajiantou local-menu-arrow nav-icon-14"></i>' +

  function normalizeLeftMenuArrows() {
    const root = document.getElementById('localBrainSidebar');

    root.querySelectorAll('.local-menu-node').forEach(node => {
      const row = getDirectChild(node, '.local-menu-row');
      const children = getDirectChild(node, '.local-menu-children');
      const button = row && row.querySelector('.local-menu-item');
      if (!button) return;

      const currentArrow = button.querySelector(':scope > .local-menu-arrow-wrap');
      const needsArrow = !!children;
      const hasStableArrow = currentArrow &&
        currentArrow.querySelector(':scope > .icon-xiajiantou') &&
        currentArrow.querySelector(':scope > .icon-shangjiantou') &&
        !currentArrow.classList.contains('left-menu-dropdown-state');

      button.querySelectorAll(':scope > .left-menu-dropdown-state, :scope > svg.local-menu-arrow').forEach(arrow => arrow.remove());
      if (!needsArrow) {
        button.querySelectorAll(':scope > .local-menu-arrow-wrap').forEach(arrow => arrow.remove());
      } else if (!hasStableArrow) {
        button.querySelectorAll(':scope > .local-menu-arrow-wrap').forEach(arrow => arrow.remove());
        button.insertAdjacentHTML('beforeend', makeLeftArrowHTML());
      }
    });
  }

    const root = document.getElementById('localBrainSidebar');

      item.classList.remove('frame-active-ancestor');

    if (!activeButton) return;

    let node = activeButton.closest('.local-menu-node');
    while (node) {
      const parentChildren = node.parentElement && node.parentElement.closest('.local-menu-children');
      const parentNode = parentChildren && parentChildren.closest('.local-menu-node');
      if (!parentNode) break;

      const parentRow = getDirectChild(parentNode, '.local-menu-row');
      const parentButton = parentRow && parentRow.querySelector('.local-menu-item');
      if (parentButton && parentButton !== activeButton) {
        parentButton.classList.add('frame-active-ancestor');
      }

      node = parentNode;
    }
  }

  function bindLeftMenuInteraction() {
    const root = document.getElementById('localBrainSidebar');
    if (!root || root.dataset.frameLeftMenuBound === 'true') return;
    root.dataset.frameLeftMenuBound = 'true';

    root.addEventListener('click', event => {
      const button = event.target.closest('[data-local-menu]');
      if (!button || !root.contains(button)) return;

      event.preventDefault();
      event.stopImmediatePropagation();

      const node = button.closest('.local-menu-node');
      const children = node && getDirectChild(node, '.local-menu-children');
      if (children) {
        node.classList.toggle('expanded');
      } else {
        root.querySelectorAll('.local-menu-item.active').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
      }

      normalizeLeftMenuArrows();
      updateActiveAncestorState();
    }, true);
  }

  function watchLeftMenuRerender() {
    const root = document.getElementById('localBrainSidebar');
    if (!root || root.dataset.frameArrowWatch === 'true') return;
    root.dataset.frameArrowWatch = 'true';

    new MutationObserver(() => {
      normalizeLeftMenuArrows();
      updateActiveAncestorState();
    }).observe(root, {
      childList: true,
      subtree: true
    });
  }

  function getTopItems() {
    return Array.from(document.querySelectorAll('.double-top-nav .top-info-item'));
  }

  function getFrameRoot() {
    return document.querySelector('.product-frame') ||
      document.querySelector('.double-navigation-frame') ||
      document.querySelector('.terminal-frame') ||
      document.querySelector('.single-navigation-frame') ||
      document.body;
  }

  function getMenuDataFromNode(node) {
    const row = getDirectChild(node, '.local-menu-row');
    const button = row && row.querySelector('.local-menu-item');
    const label = row && row.querySelector('.local-menu-label');
    const childrenWrap = getDirectChild(node, '.local-menu-children');
    const childNodes = childrenWrap ? Array.from(childrenWrap.children).filter(child => child.matches('.local-menu-node')) : [];

    return {
      id: button ? button.dataset.localMenu : '',
      label: label ? label.textContent.trim() : '',
      active: !!(button && button.classList.contains('active')),
      children: childNodes.map(getMenuDataFromNode).filter(item => item.label)
    };
  }

  function removeLocalCascadeLayers(fromLevel = 1) {
    document.querySelectorAll('.local-cascade-layer.frame-local-cascade').forEach(layer => {
      if (Number(layer.dataset.level || '1') >= fromLevel) layer.remove();
    });
  }

  function showLocalCascade(items, top, left, level) {
    removeLocalCascadeLayers(level);
    if (!items || !items.length) return;

    const layer = document.createElement('div');
    layer.className = 'local-cascade-layer visible frame-local-cascade';
    layer.dataset.level = String(level);
    layer.style.setProperty('--cascade-top', top + 'px');
    layer.style.setProperty('--cascade-left', left + 'px');
    layer.innerHTML = items.map(item => {
      const activeClass = item.active && !item.children.length ? ' active' : '';
      const arrow = item.children.length ? '<i class="iconfont icon-xiajiantou local-cascade-arrow nav-icon-14" aria-hidden="true"></i>' : '';
      return '<div class="local-cascade-option' + activeClass + '" data-cascade-id="' + item.id + '">' +
        '<span>' + item.label + '</span>' + arrow +
        '</div>';
    }).join('');
    document.body.appendChild(layer);

    layer.querySelectorAll('[data-cascade-id]').forEach(option => {
      const item = items.find(candidate => candidate.id === option.dataset.cascadeId);
      option.addEventListener('mouseenter', () => {
        const rect = option.getBoundingClientRect();
        if (item && item.children.length) {
          showLocalCascade(item.children, rect.top, rect.right + 8, level + 1);
        } else {
          removeLocalCascadeLayers(level + 1);
        }
      });
      option.addEventListener('click', event => {
        event.stopPropagation();
        if (!item || item.children.length) return;

        document.querySelectorAll('.local-menu-item.active').forEach(active => active.classList.remove('active'));
        const sourceButton = document.querySelector('[data-local-menu="' + item.id + '"]');
        if (sourceButton) sourceButton.classList.add('active');
        updateActiveAncestorState();
        removeLocalCascadeLayers(1);
      });
    });
  }

  function bindCollapsedSidebarCascade() {
    const root = document.getElementById('localBrainSidebar');
    if (!root || root.dataset.frameCascadeBound === 'true') return;
    root.dataset.frameCascadeBound = 'true';

    root.addEventListener('mouseover', event => {
      const row = event.target.closest('.local-menu-row[data-local-root]');
      if (!row || !root.contains(row)) return;
      if (!getFrameRoot().classList.contains('frame-sidebar-collapsed')) return;
      if (!row.dataset.localRoot) return;

      const node = row.closest('.local-menu-node');
      const item = node && getMenuDataFromNode(node);
      if (!item || !item.children.length) {
        removeLocalCascadeLayers(1);
        return;
      }

      const rect = row.getBoundingClientRect();
      const sidebar = root.closest('.local-brain-sidebar');
      if (!sidebar) return;
      const sidebarRect = sidebar.getBoundingClientRect();
      showLocalCascade(item.children, rect.top, sidebarRect.right, 1);
    });

    document.addEventListener('mousemove', event => {
      if (!getFrameRoot().classList.contains('frame-sidebar-collapsed')) return;
      if (!event.target.closest('.local-brain-sidebar') && !event.target.closest('.local-cascade-layer')) {
        removeLocalCascadeLayers(1);
      }
    });
  }

  function findSubscriptionTrigger() {
    return getTopItems().find(item => item.textContent.includes('持续守护') || item.textContent.includes('订阅'));
  }

  function findUserTrigger() {
    return getTopItems().find(item => item.textContent.includes('超级管理员') || item.textContent.includes('用户名'));
  }

  function createSubscriptionPopover() {
    let panel = document.getElementById('frameSubscriptionPopover');
    if (panel) return panel;

    panel = document.createElement('div');
    panel.id = 'frameSubscriptionPopover';
    panel.className = 'nav-right-popover subscription-popover frame-hover-popover';
    panel.innerHTML = `
      <div class="subscription-header">
        <h2 class="subscription-title">订阅服务详情</h2>
        <p class="subscription-desc">360全网安全大脑持续守护 <strong>328</strong> 天，共 <strong>8</strong> 项订阅服务</p>
      </div>
      <div class="subscription-content">
        <div class="subscription-section-title">订阅能力</div>
        <div class="subscription-table">
          <div class="subscription-row"><span>能力一</span><span>2026-03-28</span><span>授权至 2026-12-16</span><span>检查更新</span></div>
          <div class="subscription-row"><span>能力二</span><span>2026-04-16</span><span>授权至 2026-12-16</span><span>检查更新</span></div>
          <div class="subscription-row"><span>能力三</span><span>2026-03-03</span><span>授权至 2026-12-16</span><span>检查更新</span></div>
          <div class="subscription-row"><span>能力四</span><span>2026-02-05</span><span>授权至 2026-12-16</span><span>检查更新</span></div>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    return panel;
  }

  function createUserPopover() {
    let panel = document.getElementById('frameUserPopover');
    if (panel) return panel;

    panel = document.createElement('div');
    panel.id = 'frameUserPopover';
    panel.className = 'nav-right-popover user-popover frame-hover-popover';
    panel.innerHTML = '<div class="popover-option">修改密码</div><div class="popover-option">意见反馈</div><div class="popover-option">退出登录</div>';
    document.body.appendChild(panel);
    return panel;
  }

  function positionPopover(trigger, panel) {
    panel.classList.add('visible');
    panel.style.visibility = 'hidden';
    panel.style.display = 'block';

    const rect = trigger.getBoundingClientRect();
    const width = Math.min(panel.offsetWidth || 156, window.innerWidth - 16);
    const left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8));

    panel.style.left = left + 'px';
    panel.style.top = rect.bottom + 'px';
    panel.style.visibility = '';
    panel.style.display = '';
  }

  function bindHoverPopover(trigger, panel) {
    if (!trigger || !panel || trigger.dataset.frameHoverBound === 'true') return;
    trigger.dataset.frameHoverBound = 'true';

    let closeTimer = null;

    function open() {
      clearTimeout(closeTimer);
      document.querySelectorAll('.frame-hover-popover.visible, .nav-right-popover.visible').forEach(item => {
        if (item !== panel) item.classList.remove('visible');
      });
      document.querySelectorAll('.double-top-nav .top-info-item.open').forEach(item => {
        if (item !== trigger) item.classList.remove('open');
      });
      positionPopover(trigger, panel);
      trigger.classList.add('open');
    }

    function close() {
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        if (!trigger.matches(':hover') && !panel.matches(':hover')) {
          panel.classList.remove('visible');
          trigger.classList.remove('open');
        }
      }, 120);
    }

    trigger.addEventListener('mouseenter', open);
    trigger.addEventListener('mouseleave', close);
    trigger.addEventListener('click', event => event.preventDefault());
    panel.addEventListener('mouseenter', () => clearTimeout(closeTimer));
    panel.addEventListener('mouseleave', close);
    window.addEventListener('resize', () => {
      if (panel.classList.contains('visible')) positionPopover(trigger, panel);
    });
  }

  function bindTopHoverPopovers() {
    bindHoverPopover(findSubscriptionTrigger(), createSubscriptionPopover());
    bindHoverPopover(findUserTrigger(), createUserPopover());
  }

  function applyFixes() {
    normalizeLeftMenuArrows();
    updateActiveAncestorState();
    bindLeftMenuInteraction();
    watchLeftMenuRerender();
    bindCollapsedSidebarCascade();
    bindTopHoverPopovers();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyFixes);
  } else {
    applyFixes();
  }

  setTimeout(applyFixes, 300);
})();
</script>

</body>
</html>
