/* ===== navigation icon usage rules ===== */
.iconfont {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
  color: currentColor;
}

.iconfont::before {
  color: currentColor;
}

.nav-icon-12 { width: 12px; height: 12px; font-size: 12px; }
.nav-icon-14 { width: 14px; height: 14px; font-size: 14px; }
.nav-icon-16 { width: 16px; height: 16px; font-size: 16px; }
.nav-icon-18 { width: 18px; height: 18px; font-size: 18px; }
.nav-icon-24 { width: 24px; height: 24px; font-size: 24px; }

/* 深色顶部导航：默认弱白，hover / open 变白；强调图标用品牌绿 */
.double-top-nav .iconfont,
.s-header .iconfont,
.terminal-topbar .iconfont {
  color: #AEB2B8;
}

.double-top-nav .top-security-icon,
.double-top-nav .company-icon,
.double-top-nav .user-profile-icon,
.s-header .safe-brain-iconfont,
.s-header .company-switch-icon,
.s-header .user-profile-icon,
.terminal-topbar .safe-brain-iconfont,
.terminal-topbar .company-switch-icon,
.terminal-topbar .user-profile-icon {
  color: #00AB7A !important;
}

.double-top-nav .top-info-item:hover .iconfont,
.double-top-nav .top-info-item.open .iconfont,
.double-top-nav .main-nav-item:hover .iconfont,
.double-top-nav .main-nav-item.open .iconfont,
.double-top-nav .global-menu:hover .iconfont,
.s-header .icon-button:hover .iconfont,
.s-header .icon-button.open .iconfont,
.s-header .user-dropdown:hover .iconfont,
.s-header .user-dropdown.open .iconfont,
.terminal-topbar .center-switch:hover .iconfont,
.terminal-topbar .center-switch.open .iconfont,
.terminal-topbar .visual-screen-trigger:hover .iconfont,
.terminal-topbar .visual-screen-trigger.open .iconfont,
.terminal-topbar .terminal-icon-button:hover .iconfont,
.terminal-topbar .terminal-icon-button.open .iconfont,
.terminal-topbar .terminal-user:hover .iconfont,
.terminal-topbar .terminal-user.open .iconfont {
  color: #FFFFFF !important;
}

/* 状态图标：不允许用 CSS 旋转代替，收起 / 展开分别显示不同 icon class */
.icon-state-expanded {
  display: none !important;
}

.open .icon-state-collapsed,
.expanded > .local-menu-row .icon-state-collapsed {
  display: none !important;
}

.open .icon-state-expanded,
.expanded > .local-menu-row .icon-state-expanded {
  display: inline-flex !important;
}

.dropdown-state,
.local-menu-arrow-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-left: 4px;
  flex-shrink: 0;
}

.local-menu-arrow-wrap {
  margin-left: 0;
}

/* 白色侧边栏：默认灰，hover / active 绿 */
.local-menu-icon,
.local-menu-arrow,
.local-collapse-icon {
  color: #8A9099 !important;
}

.local-menu-item:hover .local-menu-icon,
.local-menu-item:hover .local-menu-arrow,
.local-menu-item.active .local-menu-icon,
.local-menu-item.active .local-menu-arrow,
.local-collapse-icon:hover {
  color: #039972 !important;
}

.local-menu-item.disabled .local-menu-icon,
.local-menu-item.disabled .local-menu-arrow {
  color: #AEB2B8 !important;
}

/* 不再使用 SVG 箭头的旋转效果 */
.nav-chevron,
.down-icon,
.local-menu-arrow {
  transform: none !important;
  transition: color .16s ease !important;
}

    :root {
      --top-bg: #242933;
      --top-text: #D3D4D6;
      --top-muted: #AEB2B8;
      --white: #FFFFFF;
      --primary: #00AB7A;
      --primary-active: #039972;
      --primary-bg: #D9F4EE;
      --border: #E8EAED;
      --page-bg: #F2F3F5;
      --card-bg: #FFFFFF;
      --text-title: #242933;
      --text-body: #525966;
      --text-secondary: #8A9099;
      --shadow-layer: 0 8px 24px rgba(36, 41, 51, .14);
      --shadow-card: 0 4px 16px rgba(36, 41, 51, .05);
    }

    * { box-sizing: border-box; }

    html,
    body,
    button,
    input,
    textarea,
    select {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
      font-synthesis: none;
      font-synthesis-weight: none;
      font-synthesis-style: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-width: 1280px;
      height: 100vh;
      background: var(--page-bg);
      color: var(--text-body);
      overflow: hidden;
    }

    .terminal-frame {
      width: 100vw;
      min-width: 1280px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--page-bg);
      --terminal-sidebar-width: 184px;
    }

    .terminal-frame.sidebar-collapsed {
      --terminal-sidebar-width: 56px;
    }

    .s-header {
      height: 56px;
      flex-shrink: 0;
      background: var(--top-bg);
      color: var(--top-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: visible;
      position: relative;
      z-index: 100;
    }

    .s-header-left {
      height: 56px;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .s-header-logo {
      width: 254px;
      height: 24px;
      display: block;
      margin-left: 24px;
      margin-right: 24px;
      flex-shrink: 0;
    }

    .down-icon {
      width: 12px;
      height: 12px;
      margin-left: 4px;
      color: currentColor;
      transition: transform .16s ease;
      flex-shrink: 0;
    }

    .open .down-icon {
      transform: rotate(180deg);
    }

    .s-header-nav {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      white-space: nowrap;
      color: var(--white);
      padding-right: 24px;
      min-width: 0;
      flex: 1;
    }

    .safe-brain-trigger {
      height: 28px;
      display: flex;
      align-items: center;
      margin-right: 24px;
      color: var(--top-muted);
      font-size: 12px;
      line-height: 20px;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color .16s ease, color .16s ease;
    }

    .safe-brain-trigger:hover,
    .safe-brain-trigger.open {
      color: var(--white);
    }

    .safe-brain-trigger img {
      width: 24px;
      height: 24px;
      margin-right: 7px;
      vertical-align: middle;
      display: block;
      flex-shrink: 0;
    }

    .num-subscription {
      color: var(--white);
      font-weight: 500;
      margin: 0 2px;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: var(--top-muted);
      cursor: pointer;
      position: relative;
      transition: background-color .16s ease, color .16s ease;
    }

    .icon-button:hover,
    .icon-button.open {
      background: rgba(255,255,255,.08);
      color: var(--white);
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .unread-badge {
      position: relative;
    }

    .badge-dot {
      position: absolute;

  <script>
    (function () {
      'use strict';

      // ===== 内容配置入口：后续接入优先改这里 =====
      const FRAME_CONFIG = {
        version: 'V10.0',
        userName: 'admin',
        defaultActiveMenuId: 'menu-1',
        menuIconClass: 'icon-APTzuzhiguanli1',
        topActions: {
          settingIcon: 'icon-a-shezhixitong',
          notificationIcon: 'icon-a-tixinglingdang',
          notificationCount: 1
        },
        subscription: {
          iconClass: 'icon-anquandanao',
          productName: '360全网安全大脑持续守护',
          days: 328,
          count: 8,
          rows: [
            ['能力一', '2026-03-28', '授权至 2026-12-16', '检查更新'],
            ['能力二', '2026-04-16', '授权至 2026-12-16', '检查更新'],
            ['能力三', '2026-03-03', '授权至 2026-12-16', '检查更新'],
            ['能力四', '2026-02-05', '授权至 2026-12-16', '检查更新']
          ]
        },
        userMenuItems: ['修改密码', '意见反馈', '退出登录'],
        menus: [
          { id: 'menu-1', label: '菜单一' },
          {
            id: 'menu-2',
            label: '菜单二',
            expanded: true,
            children: [
              { id: 'menu-2-1', label: '二级菜单一' },
              {
                id: 'menu-2-2',
                label: '二级菜单二',
                expanded: true,
                children: [
                  { id: 'menu-2-2-1', label: '三级菜单一' },
                  { id: 'menu-2-2-2', label: '三级菜单二' }
                ]
              },
              { id: 'menu-2-3', label: '二级菜单三' }
            ]
          },
          {
            id: 'menu-3',
            label: '菜单三',
            children: [
              { id: 'menu-3-1', label: '二级菜单四' },
              { id: 'menu-3-2', label: '二级菜单五' }
            ]
          },
          { id: 'menu-4', label: '菜单四' },
          { id: 'menu-5', label: '菜单五' },
          { id: 'menu-6', label: '菜单六' },
          { id: 'menu-7', label: '菜单七' },
          { id: 'menu-8', label: '菜单八' },
          { id: 'menu-9', label: '菜单九' }
        ]
      };

      let activeMenuId = FRAME_CONFIG.defaultActiveMenuId;

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }

      function safeClassName(value) {
        return String(value || '').replace(/[^a-zA-Z0-9_-]/g, '');
      }

      function hasChildren(item) {
        return Array.isArray(item.children) && item.children.length > 0;
      }

      function getFrameRoot() {
        return document.querySelector('.terminal-frame') || document.body;
      }

      function findMenuItem(items, id) {
        for (const item of items) {
          if (item.id === id) return item;
          if (hasChildren(item)) {
            const found = findMenuItem(item.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      function hasActiveChild(item) {
        return hasChildren(item) && item.children.some(child => child.id === activeMenuId || hasActiveChild(child));
      }

      function setPageTitle(label) {
        const pageHeaderTitle = document.getElementById('pageHeaderTitle');
        if (pageHeaderTitle) pageHeaderTitle.textContent = label;
      }

      function getMenuIcon() {
        return '<i class="iconfont ' + safeClassName(FRAME_CONFIG.menuIconClass) + ' local-menu-icon nav-icon-18" aria-hidden="true"></i>';
      }

      function getArrow() {
        return '<span class="local-menu-arrow-wrap" aria-hidden="true">' +
          '<i class="iconfont icon-xiajiantou local-menu-arrow nav-icon-14"></i>' +
          '<i class="iconfont icon-shangjiantou local-menu-arrow nav-icon-14"></i>' +
          '</span>';
      }

      function renderMenuItem(item, level) {
        const children = hasChildren(item);
        const isActive = !children && item.id === activeMenuId;
        const isAncestor = children && hasActiveChild(item);
        const itemClasses = [
          'local-menu-item',
          'level-' + level,
          isActive ? 'active' : '',
          isAncestor ? 'frame-active-ancestor' : ''
        ].filter(Boolean).join(' ');
        const nodeClasses = ['local-menu-node', children && item.expanded ? 'expanded' : ''].filter(Boolean).join(' ');
        const rowRoot = level === 1 ? ' data-local-root="' + escapeHTML(item.id) + '"' : '';

        return '<div class="' + nodeClasses + '">' +
          '<div class="local-menu-row"' + rowRoot + '>' +
          '<button class="' + itemClasses + '" type="button" data-local-menu="' + escapeHTML(item.id) + '" title="' + escapeHTML(item.label) + '">' +
          '<span class="local-menu-main">' +
          (level === 1 ? getMenuIcon() : '') +
          '<span class="local-menu-label">' + escapeHTML(item.label) + '</span>' +
          '</span>' +
          (children ? getArrow() : '') +
          '</button>' +
          '</div>' +
          (children ? '<div class="local-menu-children">' + item.children.map(child => renderMenuItem(child, level + 1)).join('') + '</div>' : '') +
          '</div>';
      }

      function renderSidebar() {
        const root = document.getElementById('localBrainSidebar');
        if (!root) return;
        root.innerHTML = FRAME_CONFIG.menus.map(item => renderMenuItem(item, 1)).join('');
      }

      function bindSidebarClick() {
        const root = document.getElementById('localBrainSidebar');
        if (!root || root.dataset.frameMenuBound === 'true') return;
        root.dataset.frameMenuBound = 'true';
        root.addEventListener('click', function (event) {
          const button = event.target.closest('[data-local-menu]');
          if (!button || !root.contains(button)) return;
          event.preventDefault();
          event.stopPropagation();

          const item = findMenuItem(FRAME_CONFIG.menus, button.dataset.localMenu);
          if (!item) return;
          if (hasChildren(item)) {
            item.expanded = !item.expanded;
          } else {
            activeMenuId = item.id;
            setPageTitle(item.label);
          }
          renderSidebar();
          removeCascadeLayers(1);
        });
      }

      function normalizeSidebarFooter() {
        const footer = document.querySelector('.local-sidebar-footer');
        if (!footer) return;
        footer.innerHTML = '<button class="local-collapse-button" id="localSidebarCollapse" type="button" title="展开/收起菜单">' +
          '<i class="iconfont icon-xiangzuozhankai local-collapse-icon nav-icon-18 icon-collapse-expanded" aria-hidden="true"></i>' +
          '<i class="iconfont icon-xiangyouzhankai local-collapse-icon nav-icon-18 icon-collapse-collapsed" aria-hidden="true"></i>' +
          '</button>' +
          '<span>' + escapeHTML(FRAME_CONFIG.version) + '</span>';

        const button = document.getElementById('localSidebarCollapse');
        if (!button) return;
        button.onclick = function (event) {
          event.preventDefault();
          event.stopPropagation();
          getFrameRoot().classList.toggle('frame-sidebar-collapsed');
          removeCascadeLayers(1);
        };
      }

      function cascadeOption(item) {
        const children = hasChildren(item);
        const isActive = !children && item.id === activeMenuId;
        return '<div class="local-cascade-option' + (isActive ? ' active' : '') + '" data-cascade-id="' + escapeHTML(item.id) + '">' +
          '<span>' + escapeHTML(item.label) + '</span>' +
          (children ? '<i class="iconfont icon-xiajiantou local-cascade-arrow nav-icon-14" aria-hidden="true"></i>' : '') +
          '</div>';
      }

      function bindCascadeLayer(layer, level) {
        layer.querySelectorAll('[data-cascade-id]').forEach(option => {
          const item = findMenuItem(FRAME_CONFIG.menus, option.dataset.cascadeId);
          option.onmouseenter = function () {
            const rect = option.getBoundingClientRect();
            if (item && hasChildren(item)) {
              showChildCascade(item.children, rect.top, rect.right + 8, level + 1);
            } else {
              removeCascadeLayers(level + 1);
            }
          };
          option.onclick = function (event) {
            event.stopPropagation();
            if (!item || hasChildren(item)) return;
            activeMenuId = item.id;
            setPageTitle(item.label);
            renderSidebar();
            removeCascadeLayers(1);
          };
        });
      }

      function showRootCascade(rootItem, top, left) {
        removeCascadeLayers(1);
        if (!hasChildren(rootItem)) return;
        const layer = document.createElement('div');
        layer.className = 'local-cascade-layer visible frame-local-cascade';
        layer.dataset.level = '1';
        layer.style.setProperty('--cascade-top', top + 'px');
        layer.style.setProperty('--cascade-left', left + 'px');
        layer.innerHTML = '<div class="local-cascade-title">' + escapeHTML(rootItem.label) + '</div>' +
          rootItem.children.map(cascadeOption).join('');
        document.body.appendChild(layer);
        bindCascadeLayer(layer, 1);
      }

      function showChildCascade(items, top, left, level) {
        removeCascadeLayers(level);
        if (!items || !items.length) return;
        const layer = document.createElement('div');
        layer.className = 'local-cascade-layer visible frame-local-cascade';
        layer.dataset.level = String(level);
        layer.style.setProperty('--cascade-top', top + 'px');
        layer.style.setProperty('--cascade-left', left + 'px');
        layer.innerHTML = items.map(cascadeOption).join('');
        document.body.appendChild(layer);
        bindCascadeLayer(layer, level);
      }

      function removeCascadeLayers(fromLevel) {
        document.querySelectorAll('.local-cascade-layer').forEach(layer => {
          if (Number(layer.dataset.level || '1') >= fromLevel) layer.remove();
        });
      }

      function bindCollapsedCascade() {
        const root = document.getElementById('localBrainSidebar');
        if (!root || root.dataset.frameCascadeBound === 'true') return;
        root.dataset.frameCascadeBound = 'true';
        root.addEventListener('mouseover', function (event) {
          const row = event.target.closest('.local-menu-row[data-local-root]');
          if (!row || !root.contains(row)) return;
          if (!getFrameRoot().classList.contains('frame-sidebar-collapsed')) return;
          const item = findMenuItem(FRAME_CONFIG.menus, row.dataset.localRoot);
          if (!item || !hasChildren(item)) {
            removeCascadeLayers(1);
            return;
          }
          const rect = row.getBoundingClientRect();
          const sidebar = root.closest('.local-brain-sidebar');
          const sidebarRight = sidebar ? sidebar.getBoundingClientRect().right : 56;
          showRootCascade(item, rect.top, sidebarRight);
        });
      }

      function syncTopNavigation() {
        const subscription = FRAME_CONFIG.subscription;
        const subscriptionTrigger = document.getElementById('safeBrainTrigger');
        if (subscriptionTrigger) {
          subscriptionTrigger.innerHTML = '<i class="iconfont ' + safeClassName(subscription.iconClass) + ' safe-brain-iconfont nav-icon-24" aria-hidden="true"></i>' +
            '<span>' + escapeHTML(subscription.productName) + '</span>' +
            '<span class="num-subscription">' + escapeHTML(subscription.days) + '</span>' +
            '<span>天，共</span>' +
            '<span class="num-subscription">' + escapeHTML(subscription.count) + '</span>' +
            '<span>项订阅服务</span>';
        }

        const settingButton = document.querySelector('.s-header .icon-button[title="系统设置"]');
        if (settingButton) {
          settingButton.setAttribute('aria-label', '系统设置');
          settingButton.innerHTML = '<i class="iconfont ' + safeClassName(FRAME_CONFIG.topActions.settingIcon) + ' nav-icon-16" aria-hidden="true"></i>';
        }

        const notificationButton = document.querySelector('.s-header .icon-button[title="站内通知"]');
        if (notificationButton) {
          const count = FRAME_CONFIG.topActions.notificationCount;
          notificationButton.classList.toggle('unread-badge', !!count);
          notificationButton.setAttribute('aria-label', '站内通知');
          notificationButton.innerHTML = '<i class="iconfont ' + safeClassName(FRAME_CONFIG.topActions.notificationIcon) + ' nav-icon-16" aria-hidden="true"></i>' +
            (count ? '<sup class="badge-dot">' + escapeHTML(count) + '</sup>' : '');
        }

        const userTrigger = document.getElementById('userDropdown');
        if (userTrigger) {
          userTrigger.innerHTML = '<i class="iconfont icon-gerenzhongxin user-profile-icon nav-icon-16" aria-hidden="true"></i>' +
            '<span>' + escapeHTML(FRAME_CONFIG.userName) + '</span>' +
            '<span class="dropdown-state down-icon" aria-hidden="true">' +
            '<i class="iconfont icon-xiajiantou nav-icon-14 icon-state-collapsed"></i>' +
            '<i class="iconfont icon-shangjiantou nav-icon-14 icon-state-expanded"></i>' +
            '</span>';
        }
      }

      function createSubscriptionPopover() {
        let panel = document.getElementById('frameSubscriptionPopover');
        const subscription = FRAME_CONFIG.subscription;
        const rows = subscription.rows.map(row => {
          return '<div class="subscription-row">' + row.map(cell => '<span>' + escapeHTML(cell) + '</span>').join('') + '</div>';
        }).join('');
        const html = '<div class="subscription-header">' +
          '<h2 class="subscription-title">订阅服务详情</h2>' +
          '<p class="subscription-desc">' + escapeHTML(subscription.productName) + ' <strong>' + escapeHTML(subscription.days) + '</strong> 天，共 <strong>' + escapeHTML(subscription.count) + '</strong> 项订阅服务</p>' +
          '</div>' +
          '<div class="subscription-content">' +
          '<div class="subscription-section-title">订阅能力</div>' +
          '<div class="subscription-table">' + rows + '</div>' +
          '</div>';

        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'frameSubscriptionPopover';
          panel.className = 'nav-right-popover subscription-popover frame-hover-popover';
          document.body.appendChild(panel);
        }
        panel.innerHTML = html;
        return panel;
      }

      function createUserPopover() {
        let panel = document.getElementById('frameUserPopover');
        const html = FRAME_CONFIG.userMenuItems.map(item => '<div class="popover-option">' + escapeHTML(item) + '</div>').join('');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'frameUserPopover';
          panel.className = 'nav-right-popover user-popover frame-hover-popover';
          document.body.appendChild(panel);
        }
        panel.innerHTML = html;
        return panel;
      }

      function positionPopover(trigger, panel) {
        panel.classList.add('visible');
        panel.style.visibility = 'hidden';
        panel.style.display = 'block';
        const rect = trigger.getBoundingClientRect();
        const width = Math.min(panel.offsetWidth || 156, window.innerWidth - 16);
        const left = Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8));
        panel.style.left = left + 'px';
        panel.style.top = rect.bottom + 'px';
        panel.style.visibility = '';
        panel.style.display = '';
      }

      function bindHoverPopover(trigger, panel) {
        if (!trigger || !panel || trigger.dataset.frameHoverBound === 'true') return;
        trigger.dataset.frameHoverBound = 'true';
        let closeTimer = null;

        function open() {
          clearTimeout(closeTimer);
          document.querySelectorAll('.frame-hover-popover.visible, .nav-right-popover.visible').forEach(item => {
            if (item !== panel) item.classList.remove('visible');
          });
          document.querySelectorAll('.safe-brain-trigger.open, .user-dropdown.open').forEach(item => {
            if (item !== trigger) item.classList.remove('open');
          });
          positionPopover(trigger, panel);
          trigger.classList.add('open');
        }

        function close() {
          clearTimeout(closeTimer);
          closeTimer = setTimeout(() => {
            if (!trigger.matches(':hover') && !panel.matches(':hover')) {
              panel.classList.remove('visible');
              trigger.classList.remove('open');
            }
          }, 120);
        }

        trigger.addEventListener('mouseenter', open);
        trigger.addEventListener('mouseleave', close);
        trigger.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
          open();
        }, true);
        panel.addEventListener('mouseenter', () => clearTimeout(closeTimer));
        panel.addEventListener('mouseleave', close);
        window.addEventListener('resize', () => {
          if (panel.classList.contains('visible')) positionPopover(trigger, panel);
        });
      }

      function bindTopPopovers() {
        bindHoverPopover(document.getElementById('safeBrainTrigger'), createSubscriptionPopover());
        bindHoverPopover(document.getElementById('userDropdown'), createUserPopover());
      }

      function bindGlobalClose() {
        if (document.documentElement.dataset.frameGlobalCloseBound === 'true') return;
        document.documentElement.dataset.frameGlobalCloseBound = 'true';
        document.addEventListener('mousemove', function (event) {
          if (!getFrameRoot().classList.contains('frame-sidebar-collapsed')) return;
          if (!event.target.closest('.local-brain-sidebar') && !event.target.closest('.local-cascade-layer')) {
            removeCascadeLayers(1);
          }
        });
        document.addEventListener('click', function () {
          document.querySelectorAll('.frame-hover-popover.visible, .nav-right-popover.visible').forEach(panel => panel.classList.remove('visible'));
          document.querySelectorAll('.safe-brain-trigger.open, .user-dropdown.open').forEach(trigger => trigger.classList.remove('open'));
        });
      }

      function initFrame() {
        syncTopNavigation();
        normalizeSidebarFooter();
        renderSidebar();
        bindSidebarClick();
        bindCollapsedCascade();
        bindTopPopovers();
        bindGlobalClose();
        const initial = findMenuItem(FRAME_CONFIG.menus, activeMenuId);
        if (initial) setPageTitle(initial.label);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initFrame);
      } else {
        initFrame();
      }
    })();
  </script>

</body>
</html>
